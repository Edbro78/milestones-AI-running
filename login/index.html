<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logg inn — Milestones</title>
    <style>
      :root {
        --sp-navy: #002359;
        --sp-navy-pressed: #074eb9;
        --blue-50: #f3f7fd;
        --blue-200: #e6effb;
        --blue-main: #0a5edc;
        --gray-100: #f2f4f7;
        --gray-300: #d0d5dd;
        --gray-500: #667085;
        --gray-700: #344054;
        --gray-900: #101828;
        --white: #ffffff;
        --ring: rgba(10, 94, 220, 0.24);
        --radius-md: 8px;
        --radius-lg: 12px;
        --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.1), 0 1px 2px rgba(16, 24, 40, 0.06);
        --font: "Hanken Grotesk", "Inter", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--font);
        background: #eceff3;
        color: var(--sp-navy);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .panel {
        width: 100%;
        max-width: 26rem;
        background: var(--white);
        border: 1px solid #eaecf0;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 2rem;
      }
      h1 { font-size: 1.85rem; font-weight: 500; margin: 0; }
      .lead { margin: 0.4rem 0 0; color: var(--gray-500); font-size: 0.95rem; }
      .back { display: inline-flex; margin-bottom: 1.25rem; color: var(--gray-500); font-size: 0.9rem; text-decoration: none; }
      .tabs {
        margin-top: 1.5rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.25rem;
        padding: 0.25rem;
        background: var(--gray-100);
        border-radius: var(--radius-md);
      }
      .tab {
        height: 40px;
        border: 0;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        color: var(--gray-500);
      }
      .tab[aria-selected="true"] {
        background: var(--white);
        color: var(--sp-navy);
        box-shadow: var(--shadow-sm);
      }
      label { display: block; font-weight: 500; margin: 1rem 0 0.35rem; }
      input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--gray-300);
        border-radius: var(--radius-md);
        padding: 0 0.75rem;
        font-size: 16px;
      }
      input:focus { outline: none; border-color: var(--blue-main); box-shadow: 0 0 0 4px var(--ring); }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem;
        font-size: 0.875rem;
        background: var(--blue-50);
        border: 1px solid var(--blue-200);
        border-radius: var(--radius-md);
        color: var(--gray-700);
      }
      .btn {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--blue-main);
        color: #fff;
        font-weight: 600;
        font-size: 1.05rem;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.5; }
      .btn:hover:not(:disabled) { background: var(--sp-navy-pressed); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <form class="panel" id="form">
      <a class="back" href="/">← Tilbake</a>
      <h1 id="title">Logg inn</h1>
      <p class="lead" id="lead">Velkommen tilbake til Milestones.</p>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" id="tab-login" aria-selected="true">Logg inn</button>
        <button type="button" class="tab" id="tab-signup" aria-selected="false">Opprett konto</button>
      </div>
      <label for="email">E-post</label>
      <input id="email" type="email" required autocomplete="email" placeholder="navn@firma.no" />
      <label for="password">Passord</label>
      <input id="password" type="password" required minlength="6" placeholder="••••••••" />
      <p class="msg" id="msg" hidden></p>
      <button class="btn" id="submit" type="submit">Logg inn</button>
    </form>
    <script>
      (function () {
        var SUPABASE_URL = "https://rxbezghqgpkphssacxeg.supabase.co";
        var SUPABASE_ANON =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4YmV6Z2hxZ3BrcGhzc2FjeGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Mjg5NDYsImV4cCI6MjEwMTAwNDk0Nn0.q8Xj-DN9srW5YKaRbAovVE6csBAYK_bfjd3XfDO3qeg";
        var NEXT_LOGIN = "http://localhost:3000/login";
        var NEXT_DASHBOARD = "http://localhost:3000/dashboard";

        function tryNextLogin() {
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, 600);
          fetch(NEXT_LOGIN, { method: "GET", mode: "no-cors", signal: ctrl.signal })
            .then(function () {
              clearTimeout(timer);
              window.location.replace(NEXT_LOGIN + window.location.search);
            })
            .catch(function () {
              clearTimeout(timer);
            });
        }

        tryNextLogin();

        var mode = "login";
        var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
        var title = document.getElementById("title");
        var lead = document.getElementById("lead");
        var submit = document.getElementById("submit");
        var msg = document.getElementById("msg");
        var tabLogin = document.getElementById("tab-login");
        var tabSignup = document.getElementById("tab-signup");

        function setMode(next) {
          mode = next;
          var isLogin = mode === "login";
          title.textContent = isLogin ? "Logg inn" : "Opprett konto";
          lead.textContent = isLogin
            ? "Velkommen tilbake til Milestones."
            : "Kom i gang med din personlige løpetrener.";
          submit.textContent = isLogin ? "Logg inn" : "Opprett konto";
          tabLogin.setAttribute("aria-selected", isLogin ? "true" : "false");
          tabSignup.setAttribute("aria-selected", isLogin ? "false" : "true");
          msg.hidden = true;
        }

        tabLogin.addEventListener("click", function () { setMode("login"); });
        tabSignup.addEventListener("click", function () { setMode("signup"); });

        function show(text) {
          msg.hidden = !text;
          msg.textContent = text || "";
        }

        function goApp() {
          window.location.href = NEXT_DASHBOARD;
        }

        document.getElementById("form").addEventListener("submit", function (e) {
          e.preventDefault();
          submit.disabled = true;
          show(null);
          var email = document.getElementById("email").value;
          var password = document.getElementById("password").value;
          var request =
            mode === "login"
              ? client.auth.signInWithPassword({ email: email, password: password })
              : client.auth.signUp({ email: email, password: password });
          request
            .then(function (result) {
              if (result.error) {
                var message = result.error.message || "Innlogging feilet";
                if (message.toLowerCase().indexOf("invalid login") !== -1) {
                  message =
                    "Feil e-post eller passord, eller kontoen finnes ikke. Prøv «Opprett konto» først.";
                }
                throw new Error(message);
              }
              if (mode === "signup" && result.data && !result.data.session) {
                setMode("login");
                show(
                  "Kontoen er opprettet. Er e-postbekreftelse på i Supabase, sjekk innboksen. Ellers kan du logge inn nå."
                );
                return;
              }
              goApp();
            })
            .catch(function (err) {
              show(err.message || "Innlogging feilet");
            })
            .then(function () {
              submit.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
